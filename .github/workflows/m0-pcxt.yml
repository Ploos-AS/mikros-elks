name: M0 PC-XT build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pcxt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ELKS host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo libncurses5-dev libelf-dev ncompress bison flex nasm

      - name: Fetch pinned ELKS
        run: sh ./scripts/fetch-elks.sh

      - name: Build PC/XT baseline
        run: |
          mkdir -p out/pcxt
          sh ./scripts/build-pcxt.sh 2>&1 | tee out/pcxt/build.log

      - name: Upload M0 build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikros-elks-pcxt-m0
          path: |
            out/pcxt/image/
            out/pcxt/SHA256SUMS
            out/pcxt/build.log
          if-no-files-found: warn
