name: M0 PC-XT qualification

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pcxt-m0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ELKS host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo libncurses5-dev libelf-dev ncompress bison flex nasm qemu-system-x86

      - name: Validate qualification records
        run: |
          sh ./qualification/check-ram-matrix.sh
          sh ./qualification/check-storage-matrix.sh
          sh ./qualification/check-m0-userspace.sh

      - name: Fetch pinned ELKS
        run: sh ./scripts/fetch-elks.sh

      - name: Build PC/XT baseline
        run: |
          set -o pipefail
          mkdir -p out/pcxt
          sh ./scripts/build-pcxt.sh 2>&1 | tee out/pcxt/build.log

      - name: Verify M0 base userspace
        run: sh ./scripts/check-built-userspace.sh out/pcxt/target

      - name: Boot-test PC/XT image
        run: sh ./scripts/qemu-smoke-pcxt.sh out/pcxt

      - name: Upload M0 qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikros-elks-pcxt-m0
          path: |
            out/pcxt/image/
            out/pcxt/SHA256SUMS
            out/pcxt/build.log
            out/pcxt/qemu-smoke.log
          if-no-files-found: warn
